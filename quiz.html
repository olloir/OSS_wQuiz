<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7faf6">
    <title>단어 퀴즈 — wQuiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="./main.html" aria-label="wQuiz 홈"><span class="brand-mark">w</span><span>wQuiz</span></a>
        <nav class="top-nav" aria-label="주 메뉴">
            <a class="nav-link" href="./main.html">학습 홈</a>
            <a class="nav-link active" href="./quiz.html" aria-current="page">단어 퀴즈</a>
        </nav>
        <div class="top-actions">
            <a class="quiz-home-link" href="./main.html"><span aria-hidden="true">←</span> 홈으로</a>
            <div class="avatar" aria-label="내 프로필">W</div>
        </div>
    </header>

    <main class="quiz-shell">
        <div class="quiz-topline">
            <div class="quiz-heading">
                <p class="eyebrow">DAILY WORD CHALLENGE</p>
                <h1>오늘의 단어 퀴즈</h1>
            </div>
            <div class="quiz-count"><span id="current-count">01</span><i>/</i><span id="total-count">10</span></div>
        </div>
        <div class="quiz-progress" role="progressbar" aria-label="퀴즈 진행률" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><span id="quiz-progress-bar"></span></div>

        <section class="question-card" id="question-card" aria-labelledby="question-word" aria-live="polite">
            <div class="question-card-top">
                <span class="question-badge"><span class="category-dot"></span> 오늘의 단어</span>
                <span class="question-type">뜻을 골라주세요</span>
            </div>

            <div class="question-word-area">
                <p class="word-prompt">다음 영어 단어의 뜻은 무엇일까요?</p>
                <h2 id="question-word">curious</h2>
                <p class="pronunciation" id="word-pronunciation">kjʊriəs</p>
            </div>

            <div class="answer-options" id="answer-options" role="group" aria-label="정답 선택지"></div>

            <div class="question-card-bottom">
                <div class="answer-status"><span class="answer-note"><span aria-hidden="true">✦</span> 아는 만큼 차근차근 골라보세요</span><span id="feedback" role="status" aria-live="polite"></span></div>
                <button class="button button-primary" id="next-button" type="button" disabled>다음 단어 <span>→</span></button>
            </div>
        </section>

        <div class="quiz-encouragement"><span aria-hidden="true">✿</span> 천천히 생각해도 괜찮아요. 매일의 작은 도전이 실력이 돼요!</div>

        <section class="result-card" id="result-card" aria-live="polite" hidden>
            <div class="result-icon" aria-hidden="true">✦</div>
            <p class="eyebrow">CHALLENGE COMPLETE</p>
            <h2>오늘의 퀴즈 완료!</h2>
            <p class="result-message" id="result-message">오늘도 한 걸음 성장했어요.</p>
            <div class="result-score"><strong id="score-value">0</strong><span> / 10 정답</span></div>
            <div class="result-actions"><button class="button button-primary" id="retry-button" type="button">다시 풀기 <span>↻</span></button><a class="button button-secondary" href="./main.html">학습 홈으로</a></div>
        </section>
    </main>
    <script src="./words_data.js"></script>
    <script src="./quiz_js.js"></script>
</body>
</html>
